name: FlowZ Android (debug)

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: do NOT use android-actions/setup-android here: its v3 tries to
      # install the long-obsolete "tools" package and fails the run. The
      # ubuntu runner already ships an SDK with cmdline-tools; use it directly.
      - name: Install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0"

      - name: Build libbox.aar from sing-box v1.14.4
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          git clone --depth 1 --branch v1.14.4 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile
          export PATH="$PATH:$HOME/go/bin"
          go run ./cmd/internal/build_libbox -debug
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/android/app/libs/libbox.aar"
          ls -la "$GITHUB_WORKSPACE/android/app/libs"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowz-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
